<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Anti Gravity</title>
        <link rel="icon" type="image/x-icon" href="Images/greyBall.svg" />

        <!-- CSS -->
        <link rel="stylesheet" href="style.css"/>
        
        <!-- Outfit Font-Family Link -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <!-- Display: None -->
        <section style="display: none">
            <!-- Audio -->
            <audio id="interstellar" src="Audio/interstellar - pandora., chillwithme, & cødy.mp3"></audio>
            <audio id="a-new-start" src="Audio/A New Start - Thygan Buch.mp3"></audio>

            <!-- Images -->
            <img id="grey-ball" src="Images/greyBall.svg">
            <img id="geen-portal" src="Images/geenPortal.png">
            <img id="blue-portal" src="Images/bluePortal.png">
            <img id="black-portal" src="Images/blackPortal.png">
            
            <img id="home-btn" src="Images/homeBtn.svg">
            <img id="restart-btn" src="Images/restartBtn.svg">

            <img id="sky-backdrop" src="Images/skyBackdrop.svg">
            <img id="cave-backdrop" src="Images/caveBackdrop.svg">

            <img id="grass-blades" src="Images/grassBarBlades.svg">
            <img id="grass-bar" src="Images/grassBar.svg">

            <img id="cloud-fluff" src="Images/cloudBarFluff.svg">
            <img id="cloud-bar" src="Images/cloudBar.svg">
            
            <img id="short-grass-platform" src="Images/shortGrassPlatform.svg">
            <img id="tall-grass-platform" src="Images/tallGrassPlatform.svg">
            
            <img id="cloud-platform" src="Images/cloudPlatform.svg">
            <img id="cloud-platform-fluff" src="Images/cloudPlatformFluff.svg">

            <img id="horiz-rock-platform" src="Images/horizontalChocolateBar.svg">
            <img id="vert-rock-platform" src="Images/verticleChocolateBar.svg">
            <img id="cave-bar" src="Images/caveBars.svg">
        </section>

        <main>
            <canvas id="game-canvas" width="1000px" height="500px"></canvas>
        </main>
        
        <!-- JS -->
        <script defer src="functions.js"></script>
        <script defer src="script.js"></script>
    </body>
</html>
